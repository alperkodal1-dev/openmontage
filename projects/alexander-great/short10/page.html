<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="a/fonts/fonts.css">
<style>
:root{--ink:#0a1417;--bone:#efe6d2;--gold:#d9b26a;--gold2:#f1d49a;--red:#9c2f1f;--green:#7dffb0;--orange:#ff9a6b}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);position:relative;font-family:'Manrope'}
.bg{position:absolute;inset:0;overflow:hidden}
.bg img{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.shade{position:absolute;inset:0;background:linear-gradient(#0a1417e6 0%,#0a141700 26%,#0a141700 58%,#0a1417f0 100%)}
.flash{position:absolute;inset:0;background:#f4ead2;opacity:0}
.title{position:absolute;left:50px;right:50px;top:300px;text-align:center;font-family:'Cinzel';font-weight:900;line-height:1.0;text-shadow:0 8px 34px #000}
.t1{color:var(--bone);font-size:126px}.t2{color:var(--gold2);font-size:126px}
.stamp{position:absolute;left:50%;top:640px;background:var(--red);color:#ffe9c4;font-family:'Cinzel';font-weight:900;font-size:84px;padding:14px 42px;border:6px solid #ffe9c4;white-space:nowrap;box-shadow:0 20px 60px #000a}
.big{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:'Cinzel';font-weight:900;font-size:230px;color:var(--gold2);text-shadow:0 10px 40px #000}
.tag{position:absolute;left:50%;top:640px;transform:translateX(-50%);font-family:'Cinzel';font-weight:700;font-size:44px;letter-spacing:3px;color:var(--bone);background:#0a1417cc;border:3px solid var(--gold);padding:10px 26px;white-space:nowrap}
.ring{position:absolute;border:8px solid var(--green);border-radius:50%;box-shadow:0 0 40px var(--green)}
.cap{position:absolute;left:70px;right:150px;top:1250px;min-height:200px;display:block;background:#0a1417c8;border-radius:24px;padding:30px 36px;font-weight:800;font-size:72px;line-height:1.18;color:var(--bone);text-align:center;text-transform:uppercase}
.cap span{display:inline-block;margin:0 .14em}.cap .on{color:var(--gold2)}.cap .ev{color:var(--orange)}.cap .lg{color:var(--green)}
.credit{position:absolute;left:70px;bottom:250px;font-size:22px;color:#efe6d2aa}
</style></head><body>
<div class="bg" id="bg"><img id="img"></div>
<div class="shade"></div>
<div class="title" id="title"><div class="t1">NO WORLDS</div><div class="t2">LEFT?</div></div>
<div class="stamp" id="stamp">NOT ONCE.</div>
<div class="big" id="y90">∞</div>
<div class="tag" id="tag"></div>
<div class="ring" id="ring"></div>
<div class="cap" id="cap"></div>
<div class="credit" id="credit"></div>
<div class="flash" id="flash"></div>
<script>
const W = [["Alexander", 0.0, 0.73], ["wept.", 0.73, 1.13], ["No", 1.71, 1.84], ["worlds", 1.84, 2.23], ["left", 2.23, 2.48], ["to", 2.48, 2.61], ["conquer...", 2.61, 3.26], ["or", 3.5, 3.67], ["did", 3.67, 3.92], ["he?", 3.92, 4.17], ["Worlds", 4.61, 5.09], ["without", 5.09, 5.64], ["end.", 5.64, 5.96], ["He", 6.46, 6.64], ["was", 6.64, 6.92], ["not", 6.92, 7.19], ["lord", 7.19, 7.56], ["of", 7.56, 7.74], ["even", 7.74, 8.1], ["one.", 8.1, 8.47]];
const SCENES = [ // start, end, img, fx, fy, zoomFrom, zoomTo, credit
  [0.00, 4.55, 'a/mosaic_alex.jpg', 0.42, 0.36, 1.45, 1.15, 'Alexander Mosaic, Pompeii · photo TyB, CC BY 2.0'],
  [4.55, 6.40, 'a/jwst_deepfield.jpg', 0.5, 0.5, 4.0, 1.05, "Webb's First Deep Field · NASA, ESA, CSA, STScI"],
  [6.40, 9.61, 'a/hubble_udf.jpg', 0.5, 0.5, 1.0, 1.35, 'Hubble Ultra Deep Field · NASA, ESA'],
];
const LEG = ['WEPT.','NO','WORLDS','LEFT','CONQUER...'], EVI = ['WORLDS','WITHOUT','END.','EVEN','ONE.'];
const $ = id => document.getElementById(id);
const cl = v => Math.max(0, Math.min(1, v)), eo = t => 1 - Math.pow(1 - t, 3), eio = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const imgs = {}; SCENES.forEach(s => { const i = new Image(); i.src = s[2]; imgs[s[2]] = i; });
const CH = [[0,2],[2,7],[7,10],[10,13],[13,17],[17,20]];
window.render = t => {
  const s = SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1];
  const im = $('img'); if (im.getAttribute('src') !== s[2]) im.src = s[2];
  const iw = imgs[s[2]].naturalWidth, ih = imgs[s[2]].naturalHeight, base = Math.max(1080 / iw, 1920 / ih);
  const u = cl((t - s[0]) / (s[1] - s[0]));
  let z = s[5] + (s[6] - s[5]) * (s[2].includes('jwst') ? eio(u) : u);       // deep field: one galaxy -> thousands
  if (u < 0.12 && !s[2].includes('jwst')) z *= 1 + 0.10 * (1 - u / 0.12);
  const sc = base * z, w = iw * sc, h = ih * sc;
  let x = -w * s[3], y = -h * s[4]; x = Math.min(-540, Math.max(x, 540 - w)); y = Math.min(-960, Math.max(y, 960 - h));
  let sx = 0, sy = 0; const shake = (t0, d, a) => { if (t >= t0 && t < t0 + d) { const k = 1 - (t - t0) / d; sx += a * k * Math.sin(t * 90); sy += a * k * Math.cos(t * 77); } };
  shake(3.50, 0.55, 22); shake(8.10, 0.4, 14);
  im.style.width = w + 'px'; im.style.height = h + 'px'; im.style.left = '540px'; im.style.top = '960px';
  im.style.transform = `translate(${x + sx}px,${y + sy}px)`;
  im.style.filter = (t >= 3.50 && t < 4.55) ? 'grayscale(1) sepia(.4) contrast(1.25) brightness(.8)' : 'none';
  $('credit').textContent = s[7];
  let fl = 0; [[3.50, .85], [4.55, .35], [6.40, .3], [8.10, .7]].forEach(([t0, a]) => { if (t >= t0 && t < t0 + 0.36) fl = Math.max(fl, t < t0 + 0.06 ? a * (t - t0) / 0.06 : a * (1 - (t - t0 - 0.06) / 0.3)); });
  $('flash').style.opacity = fl;
  const ti = $('title'); ti.style.opacity = t < 4.55 ? 1 : 0; ti.style.transform = `scale(${t < 0.25 ? 1.25 - 0.25 * eo(t / 0.25) : 1})`;
  const st = $('stamp'); const on1 = t >= 3.50 && t < 4.55, on2 = t >= 8.10;
  st.style.opacity = (on1 || on2) ? 1 : 0; st.textContent = on2 ? 'NOT EVEN ONE.' : '...OR DID HE?';
  const sp = cl((t - (on2 ? 8.10 : 3.50)) / 0.25); st.style.top = on2 ? '700px' : '660px';
  st.style.transform = `translateX(-50%) rotate(-5deg) scale(${2.2 - 1.2 * eo(sp)})`;
  const yb = $('y90'); yb.style.fontSize = '300px'; yb.style.top = '260px'; yb.style.color = '#f1d49a';
  yb.style.opacity = (t >= 4.70 && t < 6.40) ? cl((t - 4.70) / 0.3) : 0; yb.style.transform = `scale(${1.4 - 0.4 * eo(cl((t - 4.70) / 0.5))})`;
  const tg = $('tag');
  if (t >= 4.70 && t < 6.40) { tg.textContent = 'NOT ONE WORLD... INFINITE WORLDS'; tg.style.opacity = cl((t - 4.8) / 0.2); tg.style.top = '640px'; }
  else if (t >= 6.55 && t < 9.61) { tg.textContent = 'PLUTARCH, ON TRANQUILITY OF MIND 466D'; tg.style.opacity = cl((t - 6.6) / 0.2); tg.style.top = '420px'; tg.style.fontSize = '34px'; }
  else tg.style.opacity = 0;
  $('ring').style.opacity = 0;
  const ci = CH.findIndex(([a, b]) => t >= W[a][1] - 0.05 && (b >= W.length || t < W[b][1] - 0.05));
  const c = CH[ci < 0 ? 0 : ci];
  $('cap').innerHTML = W.slice(c[0], c[1]).map(([w, s0]) => {
    const key = w.toUpperCase(); const on = t >= s0 - 0.03;
    const cls = !on ? '' : (c[0] < 7 && LEG.includes(key) ? 'lg' : (c[0] >= 10 && EVI.includes(key) ? 'ev' : 'on'));
    return `<span class="${cls}">${key.replace('CONQUER...', 'CONQUER…')}</span>`; }).join('');
};
</script></body></html>
