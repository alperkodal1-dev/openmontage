<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Cinzel';src:url(Cinzel-700-normal.woff2) format('woff2');font-weight:700}
html,body{margin:0;background:#000}
#c{position:relative;width:1024px;height:1024px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#1d2b2f 0%,#0a1417 55%,#05090a 100%)}
#rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 51%,rgba(217,178,106,.07) 0deg 4deg,rgba(0,0,0,0) 4deg 12deg);-webkit-mask:radial-gradient(circle at 50% 51%,transparent 372px,#000 380px,#000 470px,transparent 512px);mask:radial-gradient(circle at 50% 51%,transparent 372px,#000 380px,#000 470px,transparent 512px)}
#glow{position:absolute;left:112px;top:120px;width:800px;height:800px;border-radius:50%;box-shadow:0 0 120px 30px rgba(217,178,106,.28)}
#g{position:absolute;inset:0}
svg.t{position:absolute;inset:0}
</style></head><body><div id="c">
<div id="rays"></div><div id="glow"></div><div id="g"></div>
<svg class="t" viewBox="0 0 1024 1024" width="1024" height="1024">
 <defs>
  <path id="top" d="M 92 520 A 420 420 0 0 1 932 520"/>
  <path id="bot" d="M 66 520 A 446 446 0 0 0 958 520"/>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c7"/><stop offset=".45" stop-color="#f1d49a"/><stop offset="1" stop-color="#b88a3e"/></linearGradient>
 </defs>
 <circle cx="512" cy="520" r="394" fill="none" stroke="#d9b26a" stroke-width="2" stroke-opacity=".7"/>
 <circle cx="512" cy="520" r="488" fill="none" stroke="#d9b26a" stroke-width="3" stroke-opacity=".55"/>
 <text font-family="Cinzel" font-weight="700" font-size="64" letter-spacing="7" fill="url(#gold)" style="paint-order:stroke" stroke="#05090a" stroke-width="6">
  <textPath href="#top" startOffset="50%" text-anchor="middle">OR SO THE STORY GOES</textPath></text>
 <text font-family="Cinzel" font-weight="700" font-size="34" letter-spacing="12" fill="#efe6d2" opacity=".85">
  <textPath href="#bot" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">✦ LEGENDS · RECORDS ✦</textPath></text>
</svg>
</div><script>
fetch('globe.svg.html').then(r=>r.text()).then(t=>{document.getElementById('g').innerHTML=t;document.title='ready'});
</script></body></html>
